<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gen Far Depot</title>
<style>
  body{font-family:system-ui;max-width:640px;margin:40px auto;padding:20px;background:#0a0a0a;color:#eee}
  h1{font-size:20px;margin-bottom:8px}
  p{color:#888;font-size:14px}
  input,button{padding:10px;font-size:14px;border-radius:6px;border:1px solid #333;background:#111;color:#eee;margin:4px 0}
  button{background:#fff;color:#000;cursor:pointer;font-weight:600}
  pre{background:#111;padding:16px;border-radius:8px;overflow:auto;font-size:12px;border:1px solid #222}
</style>
</head>
<body>
  <h1>Gen Far Depot</h1>
  <p>Endpoint: <code>/api/v2/gen?count=N</code></p>
  <input id="c" type="number" value="5" min="1" max="100">
  <button onclick="run()">Generate</button>
  <pre id="out">siap...</pre>
<script>
async function run(){
  const c=document.getElementById('c').value;
  document.getElementById('out').textContent='loading...';
  try{
    const r=await fetch('/api/v2/gen?count='+c);
    const j=await r.json();
    document.getElementById('out').textContent=JSON.stringify(j,null,2);
  }catch(e){document.getElementById('out').textContent='error: '+e.message}
}
</script>
</body>
</html>
